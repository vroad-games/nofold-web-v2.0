<!-- Simple game placeholder SVG -->
<svg width="280" height="160" viewBox="0 0 280 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="280" height="160" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3036;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1e23;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Game controller icon -->
  <g transform="translate(140, 80)">
    <path d="M-20 -10 L-15 -10 L-15 -5 L-10 -5 L-10 0 L-15 0 L-15 5 L-20 5 Z" fill="#667eea" opacity="0.6"/>
    <circle cx="12" cy="-3" r="3" fill="#667eea" opacity="0.6"/>
    <circle cx="12" cy="3" r="3" fill="#667eea" opacity="0.6"/>
    <rect x="-25" y="-8" width="50" height="16" rx="8" fill="none" stroke="#667eea" stroke-width="2" opacity="0.4"/>
  </g>
  <!-- Text -->
  <text x="140" y="120" text-anchor="middle" fill="#667eea" font-family="Arial, sans-serif" font-size="12" opacity="0.7">Game Preview</text>
</svg>
